# Offline end-to-end check on the synthetic corpus with a tiny random WavLM (runs on CPU in ~1 minute).
# Accuracy is meaningless here; it only proves the whole stack works on a new machine.
_base_: ../base.yaml
experiment: smoke

data:
  dataset: synthetic
  manifest: data/processed/synthetic/manifest.csv
  audio_root: data/raw/synthetic
  scheme: iemocap5
  train_max_seconds: 2.0
  eval_max_seconds: 2.0

encoder:
  tiny: true

pool:
  heads: 4
  head_hidden: 32
  center_dim: 8
  supcon_dim: 16

loss:
  weights: {kl: 1.0, focal: 1.0, center: 0.01, supcon: 0.1, vad: 0.5}

train:
  epochs: 2
  batch_size: 8
  eval_batch_size: 8
  num_workers: 0
  precision: fp32
  lr_encoder: 1.0e-3
  lr_head: 1.0e-3
  ema_decay: 0.9
  schedule: {type: exp, gamma: 0.9, decay_epochs: 20, warmup_epochs: 0}
  patience: 5
  log_every: 0
