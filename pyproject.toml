[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "emotisense"
version = "0.1.0"
description = "Multi-emotion intelligence from customer call audio: WavLM speech emotion recognition, conversation timelines and escalation alerts."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "torch>=2.1",
    "transformers>=4.38",
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "soundfile>=0.12",
    "requests>=2.31",
    "kagglehub>=0.3",
    "tqdm>=4.65",
]

[project.optional-dependencies]
app = ["fastapi>=0.109", "uvicorn>=0.27", "python-multipart>=0.0.9", "streamlit>=1.35", "plotly>=5.18"]
track = ["tensorboard>=2.14", "wandb>=0.16"]
dev = ["pytest>=8.0", "httpx>=0.24"]

[project.scripts]
emotisense = "emotisense.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::FutureWarning",
    "ignore::UserWarning",
]
