<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EmotiSense turns any recording into a second-by-second emotion timeline, synced to the audio. It runs entirely on your machine." />
    <meta name="theme-color" content="#04060e" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>EmotiSense · Feel the shape of every voice</title>
    <script>
      // Apply the saved theme before first paint so there is no flash.
      try {
        var saved = localStorage.getItem("emotisense-theme") || "system";
        var dark = saved === "dark" || (saved === "system" && window.matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
